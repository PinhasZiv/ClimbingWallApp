name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install web app dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships a preinstalled Android SDK (current platforms/build-tools,
      # ANDROID_HOME preset) — no separate SDK-install action needed. Just accept licenses;
      # android-actions/setup-android@v3 additionally tries to install the long-removed
      # legacy "tools" package and fails on current SDK repos.
      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
